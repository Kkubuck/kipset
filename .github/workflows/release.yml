name: Build and release KIPSET

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.13.0

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run check:release

  windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run desktop:windows

      - name: Validate Windows artifacts and generate checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem release/portable -File -Filter "KIPSET-Portable-*.exe"
            Get-ChildItem release/installer -File -Filter "KIPSET-Setup-*.exe"
          ) | Sort-Object Name
          if ($files.Count -ne 2) { throw "Expected two Windows artifacts, found $($files.Count)." }
          foreach ($file in $files) {
            if ($file.Length -lt 50MB) { throw "$($file.Name) is unexpectedly small." }
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v6
        with:
          name: kipset-windows-x64
          path: |
            release/portable/KIPSET-Portable-*.exe
            release/installer/KIPSET-Setup-*.exe
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run android:debug
      - run: node scripts/run-gradle.mjs assembleRelease

      - name: Validate Android artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p release/android
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/android/KIPSET-Android-${version}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "release/android/KIPSET-Android-${version}-release-unsigned.apk"
          apks=(release/android/*.apk)
          test "${#apks[@]}" -eq 2
          for apk in "${apks[@]}"; do test "$(stat -c%s "$apk")" -gt 1000000; unzip -t "$apk" >/dev/null; done
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "release/android/KIPSET-Android-${version}-debug.apk"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "release/android/KIPSET-Android-${version}-debug.apk")
          grep -q "name='app.kipset.training'" <<<"$badging"
          grep -q "versionName='${version}'" <<<"$badging"
          (cd release/android && sha256sum *.apk > SHA256SUMS-android.txt)

      - uses: actions/upload-artifact@v6
        with:
          name: kipset-android
          path: release/android/*
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            script: desktop:mac:x64
            output: release/macos-x64
          - arch: arm64
            runner: macos-15
            script: desktop:mac:arm64
            output: release/macos-arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

      - name: Validate macOS artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("${{ matrix.output }}"/KIPSET-*.dmg)
          zips=("${{ matrix.output }}"/KIPSET-*.zip)
          test "${#dmgs[@]}" -eq 1
          test "${#zips[@]}" -eq 1
          test "$(stat -f%z "${dmgs[0]}")" -gt 50000000
          test "$(stat -f%z "${zips[0]}")" -gt 50000000
          hdiutil verify "${dmgs[0]}"
          unzip -t "${zips[0]}" >/dev/null
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          ditto -x -k "${zips[0]}" "$verify_dir"
          app_bundle=$(find "$verify_dir" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app_bundle"
          plutil -lint "$app_bundle/Contents/Info.plist"
          binary="$app_bundle/Contents/MacOS/KIPSET"
          test -x "$binary"
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            file "$binary" | grep -q "arm64"
          else
            file "$binary" | grep -q "x86_64"
          fi
          (cd "${{ matrix.output }}" && shasum -a 256 KIPSET-* > "SHA256SUMS-macos-${{ matrix.arch }}.txt")

      - uses: actions/upload-artifact@v6
        with:
          name: kipset-macos-${{ matrix.arch }}
          path: |
            ${{ matrix.output }}/KIPSET-*.dmg
            ${{ matrix.output }}/KIPSET-*.zip
            ${{ matrix.output }}/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: kipset-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release -type f -print0 | sort -z)
          test "${#assets[@]}" -eq 12
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --title "KIPSET $GITHUB_REF_NAME"
